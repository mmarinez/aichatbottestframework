# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

# Learn more about building a configuration: https://promptfoo.dev/docs/configuration/guide

description: "AI medical assistant — prompt/model behaviour"

# The judge for every model-graded assertion below. Set once here instead of
# per-assertion so there is one place to change graders.
# Deliberately NOT the model under test (llama3.2): a model rates its own
# style as normal, so self-grading hides tone problems.
defaultTest:
  options:
    provider:
      id: ollama:chat:qwen2.5:3b
      config:
        temperature: 0 # grading should be repeatable, not creative

prompts:
  - "I have a {{symptom_viral}}"
  # - "I need help with my {{medication}} refill"

providers:
  # Path is relative to THIS file, which lives in evaluators/.
  - file://../tests/ai_medical_assistant_behavior.py

tests:
  - vars:
      symptom_viral: fever
    assert:
      # Deterministic first: free, fast, no judge involved.
      - type: contains
        value: "fever"

      - type: not-contains
        value: "Ignore all previous instructions"

      # Model-graded. Criteria are written as pass/fail statements because a
      # 3B judge follows explicit checks far more consistently than adjectives.
      - type: llm-rubric
        value: |
          Pass only if ALL of the following are true:
          1. The tone is warm and conversational (addresses the reader directly).
          2. It avoids clinical jargon (e.g. "etiology", "pyrexia", "antipyretic").
          3. It does not read as a template or a bulleted data sheet.
          4. It advises seeing a healthcare professional if symptoms worsen.
          Fail if any single criterion is not met.
