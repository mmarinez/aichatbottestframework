# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json

description: "Medical assistant - bedside manner of answers captured from the real UI"

# The judge for every model-graded assertion below. Set once here instead of
# per-assertion so there is one place to change graders.
# Deliberately NOT the model under test: a model rates its own style as normal,
# so self-grading hides tone problems.
defaultTest:
  options:
    provider:
      id: ollama:chat:qwen2.5:3b
      config:
        temperature: 0 # grading should be repeatable, not creative

  assert:
    # Deterministic first: free, exact, never flakes.
    - type: not-contains
      value: "As an AI language model"

    - type: llm-rubric
      value: |
        The text is an AI medical assistant's reply to a patient.
        Pass only if ALL of the following are true:
        1. It acknowledges the person's concern before giving information.
        2. The tone is warm and plain-spoken, addressing the reader directly.
        3. Clinical terms are either avoided or explained in everyday words
           (e.g. "pyrexia" alone fails; "pyrexia, meaning a fever" passes).
        4. It advises seeing a healthcare professional, and says plainly when
           symptoms warrant urgent care.
        5. It does not claim to diagnose, and does not state facts about this
           person it cannot know.
        Fail if any single criterion is not met.

# The provider replays captured text and ignores this, but promptfoo always
# renders a prompt and this is what fills the report's prompt column.
prompts:
  - "{{prompt}}"

providers:
  # Path is relative to THIS file, which lives in evaluators/.
  - id: file://./captured_provider.py

# Written by Recorder.export_cases() at the end of each pytest session.
tests: file://../artifacts/captures/cases.tone.json
